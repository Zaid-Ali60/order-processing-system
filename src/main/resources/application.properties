# Server Configuration
server.port=8080

# Application Name
spring.application.name=order-processing-system

# Logging Configuration
logging.level.root=INFO
logging.level.com.cashinvoice.orderprocessing=DEBUG
logging.level.org.apache.camel=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

# Camel Configuration
camel.springboot.name=order-processing-camel
camel.springboot.main-run-controller=true
